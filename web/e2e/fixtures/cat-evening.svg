  <title id="title">Кот спит — вечер</title>
  <desc id="desc">Тот же рыжий кот свернулся на мягкой подушке у окна. Его бок тихо дышит, кончик хвоста иногда дёргается; звёзды мерцают, а над ушком плывут zZz. Цикл — две секунды.</desc>
